# Render Blueprint. Models are NOT in git: they are fetched at start-up from the HTTPS URLs below (SHA256-verified),
# or read from a persistent disk if you attach one. See docs/render_deployment.md.
services:
  - type: web
    name: deepverify-backend
    runtime: docker
    plan: standard            # torch + ResNet18 needs more memory than the smallest plans; measure and adjust
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: CORS_ORIGINS
        value: "https://deepverify-frontend-zu2d.onrender.com,http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000"
      - key: REQUIRED_MODELS
        value: image,video
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: MAX_CONCURRENT_INFERENCES
        value: "1"
      - key: TORCH_THREADS
        value: "1"
      - key: MODEL_SAFETENSORS_URL
        sync: false
      - key: MODEL_SAFETENSORS_SHA256
        sync: false
      - key: IMAGE_METADATA_URL
        sync: false
      - key: IMAGE_METADATA_SHA256
        sync: false
      - key: VIDEO_METADATA_URL
        sync: false
      - key: VIDEO_METADATA_SHA256
        sync: false
      - key: HF_TOKEN
        sync: false
